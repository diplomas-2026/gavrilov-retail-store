name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: product-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven unit tests
        run: mvn -B -ntp -Dtest='*Test,!*IntegrationTest' test

  e2e:
    name: E2E (Docker API + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: product-web/package-lock.json

      - name: Install web dependencies
        working-directory: product-web
        run: npm ci

      - name: Build web
        working-directory: product-web
        run: npm run build

      - name: Install Playwright (Chromium)
        working-directory: product-web
        run: npx playwright install --with-deps chromium

      - name: Start Postgres + API
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          set -euo pipefail
          for i in {1..90}; do
            if curl -fsS http://localhost:8080/swagger-ui/index.html > /dev/null; then
              echo "API is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/swagger-ui/index.html > /dev/null

      - name: Wait for generated users.txt
        run: |
          set -euo pipefail
          for i in {1..45}; do
            if [ -s product-api/users.txt ]; then
              echo "Generated users:"
              cat product-api/users.txt
              exit 0
            fi
            sleep 2
          done
          echo "users.txt was not generated"
          exit 1

      - name: Run Playwright tests
        working-directory: product-web
        env:
          CI: "true"
        run: npx playwright test --retries=1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: product-web/artifacts/screenshots
          if-no-files-found: warn

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            product-web/playwright-report
            product-web/test-results
          if-no-files-found: warn

      - name: Save docker logs on failure
        if: failure()
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-log
          path: docker-compose.log
          if-no-files-found: warn

      - name: Stop containers
        if: always()
        run: docker compose down -v
