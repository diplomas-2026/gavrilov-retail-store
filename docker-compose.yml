services:

  api:
    build:
      context: ./product-api
    container_name: gavrilov-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gavrilov_store
      DB_USERNAME: gavrilov
      DB_PASSWORD: gavrilov
      APP_SEED_DIR: /app/project/seed-data
      APP_USERS_FILE: /app/project/users.txt
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_UNSAFE_SSL: ${GIGACHAT_UNSAFE_SSL:-true}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Lite}
    ports:
      - "8081:8080"
    volumes:
      - ./product-api:/app/project

volumes:
  postgres_data:
