name: Deploy To Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product-web/package-lock.json

      - name: Build frontend
        working-directory: product-web
        run: |
          npm ci
          npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add deploy host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload frontend build
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_WEB_DIR: ${{ secrets.DEPLOY_WEB_DIR }}
        run: |
          FRONTEND_DIR="product-web/dist"
          if [ -d "product-web/build" ]; then
            FRONTEND_DIR="product-web/build"
          fi
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_WEB_DIR' && find '$DEPLOY_WEB_DIR' -mindepth 1 -maxdepth 1 -exec rm -rf {} +"
          scp -r "$FRONTEND_DIR"/* "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_WEB_DIR/"

      - name: Deploy API on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          GIGACHAT_API_KEY: ${{ secrets.GIGACHAT_API_KEY }}
          ASSISTANT_DAILY_TOKEN_LIMIT: ${{ secrets.ASSISTANT_DAILY_TOKEN_LIMIT }}
          ASSISTANT_QUOTA_TIME_ZONE: ${{ secrets.ASSISTANT_QUOTA_TIME_ZONE }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_APP_DIR' && printf 'GIGACHAT_API_KEY=%s\nGIGACHAT_SCOPE=GIGACHAT_API_PERS\nGIGACHAT_UNSAFE_SSL=true\nGIGACHAT_MODEL=GigaChat-Lite\nASSISTANT_DAILY_TOKEN_LIMIT=%s\nASSISTANT_QUOTA_TIME_ZONE=%s\n' \"${GIGACHAT_API_KEY}\" \"${ASSISTANT_DAILY_TOKEN_LIMIT}\" \"${ASSISTANT_QUOTA_TIME_ZONE}\" > .env.gigachat"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_APP_DIR' && git checkout main && git pull --ff-only origin main && docker compose --env-file .env.gigachat up -d --build"
